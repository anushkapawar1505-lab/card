<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>गणपती बाप्पा मोरया</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, "Noto Serif Devanagari", serif;
    background:
        radial-gradient(circle at top, #fffdf5, #f3dfb5 70%, #e5c77e);
}

.card {
    width: 92%;
    max-width: 430px;
    min-height: 680px;
    padding: 25px 22px;
    text-align: center;
    border-radius: 28px;
    background: rgba(255,255,255,0.78);
    border: 2px solid #c99a3e;
    box-shadow: 0 15px 45px rgba(80,50,10,0.25);

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.top {
    color: #8d5d12;
    font-size: 21px;
    font-weight: bold;
    margin-top: 5px;
}

.photo-box {
    margin: 18px auto;
    width: 100%;
    max-width: 350px;
    padding: 8px;
    border: 1px solid #d4aa5b;
    border-radius: 22px;
    background: #fffaf0;
}

.ganpati {
    display: block;
    width: 100%;
    height: 370px;
    object-fit: cover;
    border-radius: 16px;
}

h1 {
    color: #955f0c;
    font-size: 27px;
    margin: 12px 0 7px;
}

.subtitle {
    color: #704b20;
    font-size: 19px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.open-btn {
    display: inline-block;
    padding: 14px 30px;
    border-radius: 35px;
    background: linear-gradient(135deg, #9d6814, #d9aa4c);
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 18px rgba(120,80,15,0.30);
    transition: 0.3s;
}

.open-btn:hover {
    transform: scale(1.05);
}

.bottom {
    color: #9a6814;
    font-size: 17px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

    <div class="top">
        ॥ श्री गणेशाय नमः ॥
    </div>

    <div class="photo-box">
        <img
            src="https://images.openai.com/static-rsc-4/2nmPq8_g-lvniHjMyKl7qeXq5X19ODklgJq6ThU6ucTk9bgQQ3Za0GWsg6h8w8Y6zreft7tcgfqVwY2V2HvjMElVfNz4bs8lN5B2_CQ3Ii2cX2OobA6PwS0AmROVEojYo1cO_DMU6mSPkh9M6La0vvPMIMKmJPJyCPK45jyyyhRKNwd0knVQEpwPso3ge7WT?purpose=fullsize"
            alt="Ganpati Bappa"
            class="ganpati">
    </div>

    <div>

        <h1>🌺 गणपती बाप्पा मोरया! 🌺</h1>

        <div class="subtitle">
            बाप्पा आले घरी,<br>
            आनंद झाला दारी!
        </div>

        <a href="invite.html" class="open-btn">
            ✨ OPEN INVITATION ✨
        </a>

    </div>

    <div class="bottom">
        🌺 ॥ मंगलमूर्ती मोरया ॥ 🌺
    </div>

</div>

</body>
</html>
